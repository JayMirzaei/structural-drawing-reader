name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Lock file is current
        run: uv lock --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        ocr: [false, true]
    name: test (py${{ matrix.python }}, ocr=${{ matrix.ocr }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --frozen ${{ matrix.ocr && '--extra ocr' || '' }}
      - name: Test (the OCR end-to-end tests skip without the extra)
        run: uv run pytest -q -n auto -rs --timeout 180
      - name: Acceptance questions, rules only
        run: |
          uv run drawing-reader eval --quiet
          if [ "${{ matrix.ocr }}" = "true" ]; then uv run drawing-reader eval eval/questions_scan.yaml --quiet; fi
      - name: Quickstart commands
        run: |
          uv run drawing-reader summary examples/access_platform_set.pdf
          uv run drawing-reader ask examples/access_platform_set.pdf "What is the brace size?" --evidence out/brace.png
          test -f out/brace_S-201.png
      - name: Example drawings are reproducible
        run: |
          uv run python examples/generate.py
          git diff --exit-code examples/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ocr: ["0", "1"]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg OCR=${{ matrix.ocr }} -t drawing-reader .
      - name: Command line works in the image
        run: |
          docker run --rm drawing-reader drawing-reader --version
          docker run --rm drawing-reader drawing-reader eval --quiet
          if [ "${{ matrix.ocr }}" = "1" ]; then
            docker run --rm drawing-reader drawing-reader eval eval/questions_scan.yaml --quiet
          fi
      - name: App answers its health check
        run: |
          docker run -d --name app -p 8501:8501 drawing-reader
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
